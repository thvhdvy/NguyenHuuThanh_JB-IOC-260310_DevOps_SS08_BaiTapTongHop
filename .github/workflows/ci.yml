name: CI-CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test: 
    runs-on: ubuntu-latest
    services:
      image: postgres:15-alpine
      env:
        POSTGRES_DB: testdb
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
      ports:
        - 5432:5432
      options:
        --health-cmd "pg_isready -U test_user -d testdb"
        --health-interval 5s
        --health-timeout 5s
        --health-retries 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      
      - name: Execute permission for gradle
        run: chmod +x gradlew

      - name: Run test
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
  
  build_image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set image name and tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "$IMAGE=gchr.io/${OWNER}/order-service" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}          
      
      - name: Build image 
        run: docker build -t $IMAGE:$SHORT_SHA -t $IMAGE:latest .

      - name: Push image
        run: |
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Deploy 
        run: echo "Deploying order-service from GHCR"